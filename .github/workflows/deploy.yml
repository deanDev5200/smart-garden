name: Deploy to Windows Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests (if available)
        run: npm test --if-present
        continue-on-error: true
      
      - name: Deploy via SSH (Git pull approach)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }}
            
            # Create deployment directory if it doesn't exist
            if (!(Test-Path ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }})) {
              New-Item -ItemType Directory -Path ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }} -Force
              cd ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }}
              git clone https://github.com/${{ github.repository }}.git .
            }
            
            # Create logs and data directories
            New-Item -ItemType Directory -Path "logs" -Force
            New-Item -ItemType Directory -Path "data" -Force
            
            # Stop existing application
            taskkill /F /IM node.exe 2>$null || echo "No running Node.js process found"
            
            # Backup current version
            if (Test-Path "app.js") {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              Compress-Archive -Path * -DestinationPath "backup_$timestamp.zip" -Force
            }
            
            # Pull latest changes from GitHub
            git fetch origin
            git checkout main
            git pull origin main
            
            # Install dependencies
            npm ci --production
            
            # Initialize database if needed
            if (!(Test-Path "data\smart_garden.db")) {
              npm run init-db
            }
            
            # Start application
            Start-Process node -ArgumentList "app.js" -NoNewWindow -RedirectStandardOutput "logs\app.log" -RedirectStandardError "logs\error.log"
            
            echo "Deployment completed successfully"
