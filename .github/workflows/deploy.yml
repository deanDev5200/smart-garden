name: Deploy to Windows Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests (if available)
        run: npm test --if-present
        continue-on-error: true
      
      - name: Create deployment package
        run: |
          mkdir -p deploy-temp
          rsync -av --progress \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=data/*.db \
            --exclude=logs \
            --exclude=.github \
            . deploy-temp/
          tar -czf smart-garden-deploy.tar.gz -C deploy-temp .
          rm -rf deploy-temp
      
      - name: Copy to Windows server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          source: "smart-garden-deploy.tar.gz"
          target: ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }}
      
      - name: Extract and restart application on Windows server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\smart-garden' }}
            
            # Stop existing application
            taskkill /F /IM node.exe 2>$null || echo "No running Node.js process found"
            
            # Backup current version
            if (Test-Path "app.js") {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              Compress-Archive -Path * -DestinationPath "backup_$timestamp.zip" -Force
            }
            
            # Extract new deployment
            Expand-Archive -Path smart-garden-deploy.tar.gz -DestinationPath . -Force
            
            # Clean up deployment package
            Remove-Item smart-garden-deploy.tar.gz
            
            # Install dependencies
            npm ci --production
            
            # Initialize database if needed
            if (!(Test-Path "data\smart_garden.db")) {
              npm run init-db
            }
            
            # Start application
            Start-Process node -ArgumentList "app.js" -NoNewWindow -RedirectStandardOutput "logs\app.log" -RedirectStandardError "logs\error.log"
            
            echo "Deployment completed successfully"
